<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Watch History</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --bg-primary: #0b0b0d;
        --bg-secondary: #141418;
        --border: #222;
        --text-primary: #f5f5f5;
        --text-secondary: #aaa;
        --text-tertiary: #888;
        --accent: #e50914;
        --accent-hover: #f40612;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        padding: 16px;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-y: auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }

      .title-icon {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        margin-right: 8px;
      }

      .header-actions {
        display: flex;
        gap: 8px;
      }

      .title-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        transition: all 0.2s;
      }

      button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      button.secondary {
        background: #333;
      }

      button.secondary:hover {
        background: #444;
      }

      .stats-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: var(--bg-secondary);
        padding: 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        transition: all 0.2s;
      }

      .stat-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .stat-card .label {
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
        font-weight: 600;
      }

      .stat-card .value {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.2;
      }

      .stat-card .unit {
        font-size: 14px;
        color: var(--text-secondary);
        margin-left: 2px;
        font-weight: 500;
      }

      .stat-card .subtitle {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 4px;
      }

      .history-list {
        margin-top: 16px;
      }

      .history-item {
        background: var(--bg-secondary);
        padding: 14px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        transition: all 0.2s;
      }

      .history-item:hover {
        border-color: var(--accent);
        transform: translateX(4px);
      }

      .history-item .title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .history-item .episode-info {
        font-size: 13px;
        color: #ddd;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .history-item .metadata {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: var(--text-tertiary);
        flex-wrap: wrap;
      }

      .history-item .metadata span {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .no-history {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-tertiary);
      }

      .no-history svg {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.3;
      }

      .no-history p {
        font-size: 16px;
        margin-bottom: 8px;
      }

      .no-history .hint {
        font-size: 13px;
        color: var(--text-tertiary);
      }

      .icon {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }

      .search-box {
        margin-bottom: 16px;
        position: relative;
      }

      .search-box input {
        width: 100%;
        padding: 10px 40px 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 14px;
      }

      .search-box input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .search-box .search-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <h1>
      <div class="title-label">
        <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <rect x="2" y="5" width="20" height="14" rx="2" ry="2" />
          <rect x="4" y="7" width="6" height="6" />
          <line x1="12" y1="15" x2="20" y2="15" />
        </svg>
        <span>Watch History</span>
      </div>
      <div class="header-actions">
        <button class="secondary" id="exportHistoryBtn">Export</button>
        <button class="secondary" id="clearHistoryBtn">Clear All</button>
      </div>
    </h1>

    <div class="stats-summary">
      <div class="stat-card">
        <div class="label">Total Time</div>
        <div class="value">
          <span id="totalHours">0</span><span class="unit">h</span> <span id="totalMinutes">0</span
          ><span class="unit">m</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="label">Sessions</div>
        <div class="value">
          <span id="totalSessions">0</span>
        </div>
        <div class="subtitle">viewing sessions</div>
      </div>

      <div class="stat-card">
        <div class="label">Average</div>
        <div class="value"><span id="avgSession">0</span><span class="unit">min</span></div>
        <div class="subtitle">per session</div>
      </div>

      <div class="stat-card">
        <div class="label">Most Watched</div>
        <div
          class="value"
          style="font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"
          title=""
        >
          <span id="mostWatched">-</span>
        </div>
        <div class="subtitle" id="mostWatchedTime"></div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search history..." />
      <svg class="icon search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
    </div>

    <div id="historyContainer" class="history-list">
      <div class="no-history">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p>No watch history yet</p>
        <div class="hint">Start watching and your history will appear here</div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
