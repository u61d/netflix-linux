<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Watch Queue</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/variables.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        padding: 16px;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-y: auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }

      .title-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .title-icon {
        width: 20px;
        height: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .queue-list {
        margin-top: 12px;
      }

      .queue-item {
        background: var(--bg-secondary);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        transition: border-color 0.2s ease;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .queue-item.dragging {
        opacity: 0.6;
        border-color: var(--accent);
      }

      .queue-item.drag-over {
        border-color: var(--accent-light);
      }

      .drag-handle {
        cursor: grab;
        color: var(--text-secondary);
        user-select: none;
        font-size: 16px;
      }

      .queue-item-info {
        min-width: 0;
      }

      .queue-item .title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .queue-item .metadata {
        font-size: 12px;
        color: var(--text-tertiary);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .item-actions {
        display: flex;
        gap: 6px;
      }

      .item-actions button {
        padding: 6px 10px;
        font-size: 12px;
      }

      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--text-tertiary);
      }

      .search-wrap {
        margin-bottom: 12px;
      }

      .search-wrap input {
        width: 100%;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
      }

      .status.error {
        color: var(--error);
      }

      .status.success {
        color: var(--success);
      }

      body.compact-mode h1 {
        font-size: 17px;
      }

      body.compact-mode .queue-item {
        padding: 8px;
      }

      body.compact-mode .queue-item .title {
        font-size: 13px;
      }

      body.compact-mode .queue-item .metadata,
      body.compact-mode .item-actions button {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>
      <div class="title-label">
        <svg
          class="title-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3" y1="6" x2="3.01" y2="6" />
          <line x1="3" y1="12" x2="3.01" y2="12" />
          <line x1="3" y1="18" x2="3.01" y2="18" />
        </svg>
        <span>Watch Queue</span>
      </div>
      <div class="actions">
        <button class="secondary" id="playNextBtn" type="button">Play Next</button>
        <button class="secondary" id="dedupeBtn" type="button">Dedupe</button>
        <button class="secondary" id="clearBtn" type="button">Clear</button>
      </div>
    </h1>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Filter queue..." />
    </div>

    <div id="queueContainer" class="queue-list"></div>
    <div id="status" class="status"></div>

    <script src="renderer.js"></script>
  </body>
</html>
