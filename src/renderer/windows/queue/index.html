<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <title>Watch Queue</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/variables.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        padding: 16px;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-y: auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }

      .title-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .title-icon {
        width: 20px;
        height: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .queue-list {
        margin-top: 12px;
      }

      .queue-item {
        background: var(--bg-secondary);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        transition: border-color 0.2s ease;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .queue-item.dragging {
        opacity: 0.6;
        border-color: var(--accent);
      }

      .queue-item.drag-over {
        border-color: var(--accent-light);
      }

      .drag-handle {
        cursor: grab;
        color: var(--text-secondary);
        user-select: none;
        font-size: 16px;
      }

      .queue-item-info {
        min-width: 0;
      }

      .queue-item .title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .queue-item .metadata {
        font-size: 12px;
        color: var(--text-tertiary);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .item-actions {
        display: flex;
        gap: 6px;
      }

      .item-actions button {
        padding: 6px 10px;
        font-size: 12px;
      }

      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--text-tertiary);
      }

      .search-wrap {
        margin-bottom: 12px;
      }

      .search-wrap input {
        width: 100%;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
      }

      .status.error {
        color: var(--error);
      }

      .status.success {
        color: var(--success);
      }

      body.compact-mode h1 {
        font-size: 17px;
      }

      body.compact-mode .queue-item {
        padding: 8px;
      }

      body.compact-mode .queue-item .title {
        font-size: 13px;
      }

      body.compact-mode .queue-item .metadata,
      body.compact-mode .item-actions button {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>
      <div class="title-label">
        <svg
          class="title-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="8" y1="6" x2="21" y2="6" />
          <line x1="8" y1="12" x2="21" y2="12" />
          <line x1="8" y1="18" x2="21" y2="18" />
          <line x1="3" y1="6" x2="3.01" y2="6" />
          <line x1="3" y1="12" x2="3.01" y2="12" />
          <line x1="3" y1="18" x2="3.01" y2="18" />
        </svg>
        <span>Watch Queue</span>
      </div>
      <div class="actions">
        <button class="secondary" id="playNextBtn" type="button">Play Next</button>
        <button class="secondary" id="dedupeBtn" type="button">Dedupe</button>
        <button class="secondary" id="clearBtn" type="button">Clear</button>
      </div>
    </h1>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Filter queue..." />
    </div>

    <div id="queueContainer" class="queue-list"></div>
    <div id="status" class="status"></div>

    <script>
      const { queueAPI } = window;
      let queue = [];
      let dragItemId = null;

      function formatDate(timestamp) {
        if (!timestamp) return '—';
        const date = new Date(timestamp);
        return date.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      }

      function showStatus(message, type = 'success') {
        const el = document.getElementById('status');
        el.className = `status ${type}`;
        el.textContent = message;
        setTimeout(() => {
          if (el.textContent === message) el.textContent = '';
        }, 3000);
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function render(items) {
        const container = document.getElementById('queueContainer');
        if (!items.length) {
          container.innerHTML = `
            <div class="empty">
              <p>Queue is empty.</p>
              <div>Use the hover-card queue button or the queue shortcut while browsing Netflix.</div>
            </div>
          `;
          return;
        }

        container.innerHTML = items
          .map((item, index) => {
            const pinned = item.pinned ? 'Pinned' : 'Normal';
            return `
              <div class="queue-item" draggable="true" data-index="${index}" data-id="${escapeHtml(item.id)}">
                <div class="drag-handle" title="Drag to reorder">⋮⋮</div>
                <div class="queue-item-info">
                  <div class="title">${escapeHtml(item.title || 'Unknown Title')}</div>
                  <div class="metadata">
                    <span>Added ${formatDate(item.addedAt)}</span>
                    <span>Last played ${formatDate(item.lastPlayedAt)}</span>
                    <span>${pinned}</span>
                  </div>
                </div>
                <div class="item-actions">
                  <button class="secondary" type="button" onclick="togglePin('${escapeHtml(item.id)}', ${item.pinned ? 'false' : 'true'})">${item.pinned ? 'Unpin' : 'Pin'}</button>
                  <button class="secondary" type="button" onclick="playItem('${escapeHtml(item.id)}')">Play</button>
                  <button class="secondary" type="button" onclick="removeItem('${escapeHtml(item.id)}')">Remove</button>
                </div>
              </div>
            `;
          })
          .join('');

        attachDragAndDrop();
      }

      function attachDragAndDrop() {
        const nodes = document.querySelectorAll('.queue-item');
        nodes.forEach((node) => {
          node.addEventListener('dragstart', () => {
            dragItemId = node.dataset.id || null;
            node.classList.add('dragging');
          });

          node.addEventListener('dragend', () => {
            dragItemId = null;
            node.classList.remove('dragging');
            node.classList.remove('drag-over');
          });

          node.addEventListener('dragover', (event) => {
            event.preventDefault();
            node.classList.add('drag-over');
          });

          node.addEventListener('dragleave', () => {
            node.classList.remove('drag-over');
          });

          node.addEventListener('drop', async (event) => {
            event.preventDefault();
            node.classList.remove('drag-over');
            const toId = node.dataset.id || null;
            if (!dragItemId || !toId || dragItemId === toId) return;

            const fromIndex = queue.findIndex((entry) => entry.id === dragItemId);
            const toIndex = queue.findIndex((entry) => entry.id === toId);
            if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return;

            try {
              await queueAPI.reorderQueue(fromIndex, toIndex);
              await loadQueue();
              showStatus('Queue reordered');
            } catch (error) {
              showStatus(`Reorder failed: ${error.message}`, 'error');
            }
          });
        });
      }

      async function loadQueue() {
        try {
          queue = await queueAPI.getQueue();
          applyFilter();
        } catch (error) {
          showStatus(`Load failed: ${error.message}`, 'error');
          document.getElementById('queueContainer').innerHTML =
            '<div class="empty">Failed to load queue.</div>';
        }
      }

      function applyFilter() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
          render(queue);
          return;
        }
        render(
          queue.filter((entry) =>
            `${entry.title || ''} ${entry.url || ''}`.toLowerCase().includes(query)
          )
        );
      }

      async function removeItem(id) {
        try {
          await queueAPI.removeFromQueue(id);
          await loadQueue();
          showStatus('Item removed');
        } catch (error) {
          showStatus(`Remove failed: ${error.message}`, 'error');
        }
      }

      async function togglePin(id, pinned) {
        try {
          await queueAPI.pinItem(id, pinned);
          await loadQueue();
          showStatus(pinned ? 'Item pinned' : 'Item unpinned');
        } catch (error) {
          showStatus(`Pin failed: ${error.message}`, 'error');
        }
      }

      async function playItem(id) {
        try {
          const item = await queueAPI.playNext(id);
          if (item) {
            showStatus(`Playing: ${item.title}`);
            await loadQueue();
          }
        } catch (error) {
          showStatus(`Play failed: ${error.message}`, 'error');
        }
      }

      async function playNext() {
        try {
          const item = await queueAPI.playNext();
          if (!item) {
            showStatus('Queue is empty', 'error');
            return;
          }
          showStatus(`Playing: ${item.title}`);
          await loadQueue();
        } catch (error) {
          showStatus(`Play next failed: ${error.message}`, 'error');
        }
      }

      async function clearQueue() {
        if (!confirm('Clear the entire queue?')) return;
        try {
          await queueAPI.clearQueue();
          await loadQueue();
          showStatus('Queue cleared');
        } catch (error) {
          showStatus(`Clear failed: ${error.message}`, 'error');
        }
      }

      async function dedupeQueue() {
        try {
          const result = await queueAPI.dedupeQueue();
          await loadQueue();
          showStatus(`Removed ${result.removed || 0} duplicate item(s)`);
        } catch (error) {
          showStatus(`Dedupe failed: ${error.message}`, 'error');
        }
      }

      window.removeItem = removeItem;
      window.playItem = playItem;
      window.togglePin = togglePin;

      document.getElementById('searchInput').addEventListener('input', applyFilter);
      document.getElementById('playNextBtn').addEventListener('click', playNext);
      document.getElementById('clearBtn').addEventListener('click', clearQueue);
      document.getElementById('dedupeBtn').addEventListener('click', dedupeQueue);

      window.addEventListener('DOMContentLoaded', loadQueue);
    </script>
  </body>
</html>
